<svg width="1200" height="360" viewBox="0 0 1200 360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0508"/>
      <stop offset="55%" stop-color="#1a0a10"/>
      <stop offset="100%" stop-color="#2a0a12"/>
    </linearGradient>
    <radialGradient id="glowRed" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff2b4a" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ff2b4a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff2b4a"/>
      <stop offset="100%" stop-color="#ff7a3c"/>
    </linearGradient>
    <linearGradient id="lockGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a3a44"/>
      <stop offset="100%" stop-color="#15151c"/>
    </linearGradient>
    <linearGradient id="coinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a4a55"/>
      <stop offset="100%" stop-color="#1c1c24"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="360" fill="url(#bg)"/>

  <circle cx="980" cy="130" r="260" fill="url(#glowRed)"/>
  <circle cx="150" cy="300" r="180" fill="url(#glowRed)" opacity="0.5"/>

  <!-- faint circuitry lines suggesting a compromised network -->
  <g stroke="#ff2b4a" stroke-width="1" opacity="0.18">
    <line x1="0" y1="60" x2="300" y2="60"/>
    <line x1="300" y1="60" x2="340" y2="20"/>
    <line x1="0" y1="140" x2="220" y2="140"/>
    <line x1="220" y1="140" x2="260" y2="180"/>
    <line x1="900" y1="300" x2="1200" y2="300"/>
    <line x1="900" y1="300" x2="870" y2="340"/>
    <line x1="1000" y1="40" x2="1200" y2="40"/>
    <line x1="1000" y1="40" x2="960" y2="80"/>
  </g>
  <g fill="#ff2b4a" opacity="0.35">
    <circle cx="300" cy="60" r="3"/>
    <circle cx="220" cy="140" r="3"/>
    <circle cx="900" cy="300" r="3"/>
    <circle cx="1000" cy="40" r="3"/>
  </g>

  <!-- Broken chain of coins draining away, then cut off -->
  <g opacity="0.85">
    <circle cx="960" cy="220" r="26" fill="url(#coinGrad)" stroke="#ff7a3c" stroke-width="2"/>
    <text x="960" y="228" font-family="'Segoe UI', Arial, sans-serif" font-size="20" fill="#ff7a3c" text-anchor="middle">$</text>

    <circle cx="1030" cy="255" r="20" fill="url(#coinGrad)" stroke="#ff7a3c" stroke-width="2" opacity="0.7"/>
    <text x="1030" y="261" font-family="'Segoe UI', Arial, sans-serif" font-size="15" fill="#ff7a3c" text-anchor="middle" opacity="0.7">$</text>

    <circle cx="1085" cy="290" r="14" fill="url(#coinGrad)" stroke="#ff7a3c" stroke-width="2" opacity="0.4"/>
    <text x="1085" y="295" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#ff7a3c" text-anchor="middle" opacity="0.4">$</text>

    <line x1="960" y1="220" x2="1030" y2="255" stroke="#ff2b4a" stroke-width="2" opacity="0.4" stroke-dasharray="4 4"/>
    <line x1="1030" y1="255" x2="1085" y2="290" stroke="#ff2b4a" stroke-width="2" opacity="0.25" stroke-dasharray="4 4"/>
  </g>

  <!-- Locked shield blocking the drain path -->
  <g transform="translate(880,150)">
    <path d="M0 -55 L48 -38 L48 10 C48 45 24 65 0 78 C-24 65 -48 45 -48 10 L-48 -38 Z"
          fill="url(#lockGrad)" stroke="#ff2b4a" stroke-width="3"/>
    <rect x="-16" y="-4" width="32" height="26" rx="4" fill="#0a0508" stroke="#ff7a3c" stroke-width="2"/>
    <path d="M-10 -4 v-10 a10 10 0 0 1 20 0 v10" fill="none" stroke="#ff7a3c" stroke-width="3"/>
    <line x1="-40" y1="-45" x2="40" y2="45" stroke="#ff2b4a" stroke-width="4" opacity="0.9"/>
    <line x1="40" y1="-45" x2="-40" y2="45" stroke="#ff2b4a" stroke-width="4" opacity="0.9"/>
  </g>

  <!-- Left accent bar -->
  <rect x="60" y="90" width="6" height="150" fill="url(#barGrad)"/>

  <!-- Alert tag -->
  <g transform="translate(60,70)">
    <path d="M0 6 L6 0 L118 0 L124 6 L124 22 L118 28 L6 28 L0 22 Z" fill="none" stroke="#ff7a3c" stroke-width="1.5" opacity="0.8"/>
    <text x="62" y="19" font-family="'Segoe UI', Arial, sans-serif" font-size="13" letter-spacing="2" fill="#ff7a3c" text-anchor="middle" opacity="0.9">BLOCKED · RISK</text>
  </g>

  <text x="90" y="185" font-family="'Segoe UI', Arial, sans-serif" font-size="64" font-weight="700"
        fill="#f4eef0" textLength="760" lengthAdjust="spacingAndGlyphs">Wallet Drainer Script</text>

  <text x="90" y="230" font-family="'Segoe UI', Arial, sans-serif" font-size="24" fill="#ff8a5c"
        textLength="330" lengthAdjust="spacingAndGlyphs">I can't help with that.</text>

  <text x="90" y="270" font-family="'Segoe UI', Arial, sans-serif" font-size="18" fill="#a9848c" opacity="0.85"
        textLength="620" lengthAdjust="spacingAndGlyphs">Requests to build malicious drainer tools are refused — safety first.</text>
</svg>